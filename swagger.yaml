components:
  schemas:
    UserRequest:
      type: object
      description: 사용자 로그인 요청
      properties:
        userId:
          type: string
          description: 사용자 ID
          example: testuser00
        password:
          type: string
          description: 사용자 PW
          example: testpw00
      required:
      - password
      - userId
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: string
        password:
          type: string
    UserProfileRequest:
      type: object
      description: 사용자 프로필 등록 및 수정 요청
      properties:
        userId:
          type: integer
          format: int64
          description: 사용자 ID
          example: 1
        email:
          type: string
          description: 사용자 이메일 주소
          example: user@example.com
        nickname:
          type: string
          description: 사용자 닉네임
          example: 티미
        homeAddress:
          type: string
          description: 사용자의 집 주소
          example: 서울특별시 종로구
        homeLatitude:
          type: number
          format: double
          description: 집 위치의 위도
          example: 37.5665
        homeLongitude:
          type: number
          format: double
          description: 집 위치의 경도
          example: 126.978
    UserProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          "$ref": "#/components/schemas/User"
        email:
          type: string
        nickname:
          type: string
        homeAddress:
          type: string
        homeLatitude:
          type: number
          format: double
        homeLongitude:
          type: number
          format: double
    StretchingRequest:
      type: object
      description: 스트레칭 등록 및 수정 요청
      properties:
        name:
          type: string
          description: 스트레칭 이름
          example: 턱 힘 빼기
        level:
          type: integer
          format: int32
          description: 스트레칭 난이도
          example: 0
        area:
          type: string
          description: 스트레칭 동작 부위
          example: 얼굴
        description:
          type: string
          description: 스트레칭 동작 방법에 대한 설명
          example: 입술은 가볍게 닫고 위아래 치아는 떨어뜨립니다. 혀를 입천장에 편안하게 둔 상태로 천천히 호흡합니다.
        durationSeconds:
          type: integer
          format: int32
          description: 스트레칭 소요 시간(초)
          example: 30
    Stretching:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        level:
          type: integer
          format: int32
        area:
          type: string
        description:
          type: string
        durationSeconds:
          type: integer
          format: int32
    StretchingDifficultyRequest:
      type: object
      description: 스트레칭 난이도 및 제약 조건 등록·수정 요청
      properties:
        stretchingId:
          type: integer
          format: int64
          description: 대상 스트레칭의 ID
          example: 1
        difficultyType:
          type: string
          description: 난이도 또는 제약 조건의 유형
          example: REQUIREMENT
        difficulty:
          type: string
          description: 등록할 난이도 또는 제약 조건 값
          example: BOTH_HANDS
    StretchingDifficultyResponse:
      type: object
      description: 스트레칭 난이도 및 제약 조건 조회 응답
      properties:
        id:
          type: integer
          format: int64
          description: 난이도 또는 제약 조건 데이터의 ID
          example: 1
        stretchingId:
          type: integer
          format: int64
          description: 해당 조건이 연결된 스트레칭의 ID
          example: 1
        difficultyType:
          type: string
          description: 난이도 또는 제약 조건의 유형
          example: REQUIREMENT
        difficulty:
          type: string
          description: 난이도 또는 제약 조건의 값
          example: BOTH_HANDS
    HealthDataRequest:
      type: object
      description: 사용자 건강 데이터 등록 요청
      properties:
        userId:
          type: integer
          format: int64
          description: 가입 시 users 테이블에서 자동으로 부여된 사용자 ID
          example: 1
        dataType:
          type: string
          description: 건강 데이터의 종류
          example: STEPS
        value:
          type: number
          format: double
          description: 건강 데이터 측정값
          example: 3500
        unit:
          type: string
          description: 측정값의 단위
          example: steps
        measuredAt:
          type: string
          format: date-time
          description: 건강 데이터가 측정된 날짜와 시간
          example: '2026-09-28T14:30:00'
        source:
          type: string
          description: 건강 데이터의 출처
          example: Health Connect
    HealthData:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          "$ref": "#/components/schemas/User"
        dataType:
          type: string
